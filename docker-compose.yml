services:
  # =============================================================================
  # Database Services
  # =============================================================================
  neo4j:
    image: neo4j:latest
    container_name: neo4j-lightrag
    ports:
      - "7474:7474"  # HTTP Browser
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_apoc_export_allow__all__nodes: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # =============================================================================
  # LLM Services
  # =============================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    ports:
      - "8001:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      --model ${VLLM_MODEL:-LiquidAI/LFM2-2.6B}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-32768}
    volumes:
      - ./model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-lightrag
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # ColBERT Embeddings Service
  # =============================================================================
  colbert:
    build:
      context: .
      dockerfile: Dockerfile.colbert
    container_name: colbert-service
    ports:
      - "8002:8002"
    environment:
      - COLBERT_MODEL=${COLBERT_MODEL:-colbert-ir/colbertv2.0}
      - COLBERT_DEVICE=${COLBERT_DEVICE:-cpu}
    volumes:
      - ./model_cache:/app/model_cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # LightRAG FastAPI Server
  # =============================================================================
  lightrag-fastapi:
    build:
      context: .
      dockerfile: Dockerfile.lightrag_fastapi
    container_name: lightrag-fastapi-server
    ports:
      - "8000:8000"
    environment:
      # LightRAG Configuration
      - LIGHTRAG_WORKING_DIR=/app/rag_storage
      - WORKSPACE=${WORKSPACE:-default}
      # Storage Configuration
      - KV_STORAGE=${KV_STORAGE:-JsonKVStorage}
      - VECTOR_STORAGE=${VECTOR_STORAGE:-NanoVectorDBStorage}
      - GRAPH_STORAGE=${GRAPH_STORAGE:-NetworkXStorage}
      - DOC_STATUS_STORAGE=${DOC_STATUS_STORAGE:-JsonDocStatusStorage}
      # LLM Configuration
      - LLM_BINDING_HOST=${LLM_BINDING_HOST:-http://vllm:8000/v1}
      - LLM_BINDING_API_KEY=${LLM_BINDING_API_KEY:-EMPTY}
      - LLM_MODEL=${LLM_MODEL:-LiquidAI/LFM2-2.6B}
      # Embedding Configuration (Ollama)
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3:latest}
      - EMBEDDING_BINDING_HOST=${EMBEDDING_BINDING_HOST:-http://ollama:11434}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
      - MAX_EMBED_TOKENS=${MAX_EMBED_TOKENS:-32768}
      # Server Configuration
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./rag_storage:/app/rag_storage
    depends_on:
      ollama:
        condition: service_healthy
      vllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

